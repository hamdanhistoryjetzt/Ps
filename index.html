<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔒 Private Cloud Vault</title>
  <!-- Firebase SDKs (from CDN) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0b0d10;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #e8edf5;
    }
    .glass {
      background: rgba(22, 28, 36, 0.85);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 32px;
      padding: 40px 36px;
      width: 100%;
      max-width: 820px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.7);
    }
    h1 { font-size: 28px; font-weight: 700; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    h1 small { font-size: 15px; font-weight: 400; color: #8895aa; margin-left: auto; }
    h2 { font-size: 18px; font-weight: 600; color: #c8d0dc; margin-bottom: 16px; }
    .sub { color: #8895aa; font-size: 14px; margin-bottom: 24px; }

    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 24px; border: none; border-radius: 14px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      background: rgba(255,255,255,0.06); color: #e8edf5;
      border: 1px solid rgba(255,255,255,0.06);
      transition: 0.2s;
    }
    .btn:hover { background: rgba(255,255,255,0.12); transform: translateY(-1px); }
    .btn-primary { background: #6c8cff; color: #fff; border-color: #6c8cff; }
    .btn-primary:hover { background: #5a7ae6; box-shadow: 0 8px 28px rgba(108,140,255,0.25); }
    .btn-danger { background: rgba(255,90,90,0.15); color: #ff6b6b; border-color: rgba(255,90,90,0.15); }
    .btn-danger:hover { background: rgba(255,90,90,0.25); }
    .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.12); }
    .btn-outline:hover { background: rgba(255,255,255,0.06); }
    .btn-sm { padding: 8px 16px; font-size: 13px; border-radius: 10px; }
    .btn-block { width: 100%; justify-content: center; }

    input {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; padding: 14px 18px; font-size: 16px;
      color: #e8edf5; outline: none; width: 100%;
    }
    input:focus { border-color: #6c8cff; box-shadow: 0 0 0 3px rgba(108,140,255,0.15); }

    .auth-box { max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    .auth-toggle { text-align: center; margin-top: 12px; color: #6c8cff; cursor: pointer; font-size: 14px; }
    .auth-toggle:hover { text-decoration: underline; }

    #loginScreen { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 10px 0; }
    .lock-icon { font-size: 54px; margin-bottom: 8px; }
    #dashboard { display: none; flex-direction: column; gap: 28px; }
    .dash-header { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .dash-header h1 { flex: 1; min-width: 160px; }
    .dash-header .actions { display: flex; gap: 10px; flex-wrap: wrap; }

    .upload-area {
      border: 2px dashed rgba(255,255,255,0.08);
      border-radius: 20px; padding: 44px 20px; text-align: center;
      transition: 0.25s; cursor: pointer;
      background: rgba(255,255,255,0.02); position: relative;
    }
    .upload-area:hover, .upload-area.dragover { border-color: #6c8cff; background: rgba(108,140,255,0.04); }
    .upload-area .icon { font-size: 42px; margin-bottom: 6px; }
    .upload-area input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .upload-progress { margin-top: 16px; height: 4px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden; display: none; }
    .upload-progress .bar { height: 100%; width: 0%; background: linear-gradient(90deg, #6c8cff, #a78bfa); border-radius: 4px; transition: width 0.15s; }

    .file-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; max-height: 420px; overflow-y: auto; padding-right: 4px; }
    .file-grid::-webkit-scrollbar { width: 4px; }
    .file-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }
    .file-item {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 18px; background: rgba(255,255,255,0.03);
      border-radius: 16px; border: 1px solid rgba(255,255,255,0.04);
      flex-wrap: wrap;
    }
    .file-item .file-icon { font-size: 28px; flex-shrink: 0; width: 40px; text-align: center; }
    .file-item .file-info { flex: 1; min-width: 120px; }
    .file-item .file-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-item .file-meta { font-size: 12px; color: #8895aa; display: flex; gap: 16px; flex-wrap: wrap; }
    .file-item .file-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .empty-state { text-align: center; padding: 40px 20px; color: #8895aa; }
    .empty-state .big-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }

    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: rgba(22,28,36,0.95); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 14px 28px; border-radius: 16px; font-size: 14px;
      color: #e8edf5; box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      opacity: 0; transition: 0.35s cubic-bezier(0.22,1,0.36,1);
      pointer-events: none; z-index: 999; display: flex; align-items: center; gap: 12px;
      max-width: 90vw;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { border-color: rgba(255,90,90,0.25); }
    .toast.success { border-color: rgba(90,220,150,0.2); }
    @media (max-width: 600px) {
      .glass { padding: 24px 18px; }
      .dash-header { flex-direction: column; align-items: stretch; }
      .file-item .file-actions { width: 100%; justify-content: flex-end; }
    }
  </style>
</head>
<body>

<div class="glass">
  <!-- LOGIN / SIGNUP -->
  <div id="loginScreen">
    <div class="lock-icon">🔐</div>
    <h1>Private Cloud Vault</h1>
    <p class="sub">Your files, accessible from any device</p>
    <div class="auth-box">
      <input type="email" id="authEmail" placeholder="Email address" />
      <input type="password" id="authPassword" placeholder="Password (min 6 chars)" />
      <button class="btn btn-primary btn-block" id="authBtn">Sign In</button>
      <div class="auth-toggle" id="authToggle">Don't have an account? <strong>Sign Up</strong></div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard">
    <div class="dash-header">
      <h1>📁 My Vault <small id="fileCount">0 files</small></h1>
      <div class="actions">
        <span style="font-size:14px; color:#8895aa;" id="userEmailDisplay"></span>
        <button class="btn btn-outline btn-sm" id="logoutBtn">🚪 Logout</button>
      </div>
    </div>

    <!-- Upload -->
    <div>
      <h2>⬆️ Upload files</h2>
      <div class="upload-area" id="uploadArea">
        <div class="icon">📤</div>
        <p>Drag &amp; drop files here, or <span class="highlight">click to browse</span></p>
        <p style="font-size:12px; margin-top:6px; color:#5a687c;">Max 100MB per file (Firebase free limit)</p>
        <input type="file" id="fileInput" multiple />
        <div class="upload-progress" id="uploadProgress"><div class="bar" id="progressBar"></div></div>
      </div>
    </div>

    <!-- File list -->
    <div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <h2>📄 Your files</h2>
        <span id="fileCountLabel">0 files</span>
      </div>
      <div class="file-grid" id="fileGrid">
        <div class="empty-state"><div class="big-icon">📭</div><p>No files uploaded yet.</p></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastIcon">✅</span> <span id="toastMsg">Message</span></div>

<script>
  // ─── 🔥 YOUR FIREBASE CONFIG (COPY FROM FIREBASE CONSOLE) ───
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  // ─── Initialize Firebase ──────────────────────────────────
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const storage = firebase.storage();

  // ─── DOM refs ──────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  const loginScreen = $('loginScreen');
  const dashboard = $('dashboard');
  const authEmail = $('authEmail');
  const authPassword = $('authPassword');
  const authBtn = $('authBtn');
  const authToggle = $('authToggle');
  const logoutBtn = $('logoutBtn');
  const userEmailDisplay = $('userEmailDisplay');
  const fileInput = $('fileInput');
  const uploadArea = $('uploadArea');
  const fileGrid = $('fileGrid');
  const fileCountLabel = $('fileCountLabel');
  const fileCount = $('fileCount');
  const progressBar = $('progressBar');
  const uploadProgress = $('uploadProgress');
  const toast = $('toast');
  const toastMsg = $('toastMsg');
  const toastIcon = $('toastIcon');

  let toastTimer;
  let isSigningUp = false;

  // ─── Toast ──────────────────────────────────────────────────
  function showToast(msg, type = 'success') {
    toastIcon.textContent = type === 'error' ? '❌' : '✅';
    toastMsg.textContent = msg;
    toast.className = 'toast ' + type;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3200);
    requestAnimationFrame(() => toast.classList.add('show'));
  }

  // ─── Auth UI toggle ──────────────────────────────────────
  authToggle.addEventListener('click', () => {
    isSigningUp = !isSigningUp;
    authBtn.textContent = isSigningUp ? 'Create Account' : 'Sign In';
    authToggle.innerHTML = isSigningUp 
      ? 'Already have an account? <strong>Sign In</strong>' 
      : 'Don\'t have an account? <strong>Sign Up</strong>';
  });

  // ─── Auth Button ──────────────────────────────────────────
  authBtn.addEventListener('click', async () => {
    const email = authEmail.value.trim();
    const password = authPassword.value;
    if (!email || password.length < 6) {
      showToast('Email and password (min 6 chars) required.', 'error');
      return;
    }
    try {
      if (isSigningUp) {
        await auth.createUserWithEmailAndPassword(email, password);
        showToast('Account created! Welcome.', 'success');
      } else {
        await auth.signInWithEmailAndPassword(email, password);
        showToast('Welcome back! 🔓', 'success');
      }
    } catch (err) {
      showToast(err.message, 'error');
    }
  });

  // Press Enter to submit auth
  authPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') authBtn.click(); });
  authEmail.addEventListener('keydown', (e) => { if (e.key === 'Enter') authBtn.click(); });

  // ─── Logout ──────────────────────────────────────────────
  logoutBtn.addEventListener('click', () => {
    auth.signOut();
  });

  // ─── Auth State Listener ──────────────────────────────────
  auth.onAuthStateChanged(async (user) => {
    if (user) {
      loginScreen.style.display = 'none';
      dashboard.style.display = 'flex';
      userEmailDisplay.textContent = user.email;
      await loadFiles();
    } else {
      loginScreen.style.display = 'flex';
      dashboard.style.display = 'none';
      fileGrid.innerHTML = `<div class="empty-state"><div class="big-icon">📭</div><p>No files uploaded yet.</p></div>`;
      fileCountLabel.textContent = '0 files';
      fileCount.textContent = '0 files';
      // Reset auth UI to sign in
      isSigningUp = false;
      authBtn.textContent = 'Sign In';
      authToggle.innerHTML = 'Don\'t have an account? <strong>Sign Up</strong>';
      authEmail.value = '';
      authPassword.value = '';
    }
  });

  // ─── Load Files from Firestore ────────────────────────────
  async function loadFiles() {
    const user = auth.currentUser;
    if (!user) return;
    try {
      const snapshot = await db.collection('files')
        .where('uid', '==', user.uid)
        .orderBy('timestamp', 'desc')
        .get();

      const files = [];
      snapshot.forEach(doc => files.push({ id: doc.id, ...doc.data() }));

      const count = files.length;
      fileCountLabel.textContent = count + ' file' + (count !== 1 ? 's' : '');
      fileCount.textContent = count + ' file' + (count !== 1 ? 's' : '');

      if (count === 0) {
        fileGrid.innerHTML = `<div class="empty-state"><div class="big-icon">📭</div><p>No files uploaded yet.</p></div>`;
        return;
      }

      let html = '';
      for (const f of files) {
        const icon = f.type?.startsWith('image/') ? '🖼️' : f.type?.includes('pdf') ? '📕' : '📄';
        const date = new Date(f.timestamp?.toMillis?.() || f.timestamp).toLocaleString();
        html += `
          <div class="file-item" data-id="${f.id}">
            <div class="file-icon">${icon}</div>
            <div class="file-info">
              <div class="file-name">${escapeHtml(f.name)}</div>
              <div class="file-meta"><span>${formatSize(f.size)}</span><span>•</span><span>${date}</span></div>
            </div>
            <div class="file-actions">
              <button class="btn btn-primary btn-sm download-btn" data-url="${f.url}" data-name="${f.name}">⬇️ Download</button>
              <button class="btn btn-danger btn-sm delete-btn" data-id="${f.id}" data-storage="${f.storagePath}">🗑️</button>
            </div>
          </div>
        `;
      }
      fileGrid.innerHTML = html;

      // Attach events
      document.querySelectorAll('.download-btn').forEach(b => {
        b.onclick = () => window.open(b.dataset.url, '_blank');
      });
      document.querySelectorAll('.delete-btn').forEach(b => {
        b.onclick = () => deleteFile(b.dataset.id, b.dataset.storage);
      });
    } catch (err) {
      showToast('Failed to load files: ' + err.message, 'error');
    }
  }

  function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
  function formatSize(b) { if (b < 1024) return b + ' B'; if (b < 1048576) return (b/1024).toFixed(1) + ' KB'; return (b/1048576).toFixed(1) + ' MB'; }

  // ─── Delete File ──────────────────────────────────────────
  async function deleteFile(docId, storagePath) {
    if (!confirm('Delete this file permanently?')) return;
    try {
      // Delete from Storage
      const ref = storage.refFromURL(storagePath);
      await ref.delete();
      // Delete from Firestore
      await db.collection('files').doc(docId).delete();
      showToast('File deleted.', 'success');
      loadFiles();
    } catch (err) {
      showToast('Delete failed: ' + err.message, 'error');
    }
  }

  // ─── Upload Files ──────────────────────────────────────────
  async function handleUpload(fileList) {
    const user = auth.currentUser;
    if (!user) return showToast('Please log in first.', 'error');
    if (!fileList.length) return;

    uploadProgress.style.display = 'block';
    progressBar.style.width = '0%';
    let uploaded = 0;
    const total = fileList.length;

    for (const file of fileList) {
      try {
        const path = `users/${user.uid}/${Date.now()}_${file.name}`;
        const storageRef = storage.ref(path);
        const snapshot = await storageRef.put(file);
        const url = await snapshot.ref.getDownloadURL();

        await db.collection('files').add({
          name: file.name,
          size: file.size,
          type: file.type,
          url: url,
          storagePath: url, // we store the download URL as path for deletion
          uid: user.uid,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });

        uploaded++;
        const pct = Math.round((uploaded / total) * 100);
        progressBar.style.width = pct + '%';
      } catch (err) {
        console.error('Upload error:', err);
        showToast(`Failed to upload ${file.name}: ${err.message}`, 'error');
      }
    }

    uploadProgress.style.display = 'none';
    progressBar.style.width = '0%';
    fileInput.value = '';
    if (uploaded > 0) {
      showToast(`Uploaded ${uploaded} file${uploaded > 1 ? 's' : ''}.`, 'success');
      loadFiles();
    }
  }

  // ─── Upload events ──────────────────────────────────────
  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length) handleUpload(e.target.files);
  });

  uploadArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadArea.classList.add('dragover');
  });
  uploadArea.addEventListener('dragleave', () => {
    uploadArea.classList.remove('dragover');
  });
  uploadArea.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadArea.classList.remove('dragover');
    if (e.dataTransfer.files.length) handleUpload(e.dataTransfer.files);
  });

  console.log('🔐 Private Cloud Vault ready. Firebase connected.');
</script>
</body>
</html>
